name: ci-pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - name: Install uv
            uses: astral-sh/setup-uv@v6
            with:
                python-version: "3.14"

          - name: Install dependencies
            run: |
                make install

          - name: Run tests
            run: |
                make test

          - name: Run linter
            run: |
                make lint